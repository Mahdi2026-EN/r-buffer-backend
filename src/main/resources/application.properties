spring.application.name=backend

# ===============================
# Database
# Default to H2 for local development so the app can run without a manual DB setup.
# For a real PostgreSQL environment, set DB_URL/DB_USERNAME/DB_PASSWORD.
# ===============================
spring.datasource.url=${DB_URL:jdbc:h2:mem:backend;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===============================
# JWT Configuration
# ===============================
# Default dev-only JWT secret. Override with APP_JWT_SECRET or secrets.properties.
# Use at least 32 characters for production.
app.jwt.secret=${APP_JWT_SECRET:DevJwtSecretKey_ChangeMe_2026_1234567890}
app.jwt.expiration=86400000

# ===============================
# CORS (comma-separated list of front-end addresses)
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# ===============================
# First administrator (created automatically if no admin exists yet)
# Override via secrets.properties or environment variables for production.
# ===============================
app.admin.email=${ADMIN_EMAIL:admin@localhost.local}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
app.admin.full-name=Site Administrator

# ===============================
# Local, private settings (git-ignored file)
# ===============================
spring.config.import=optional:classpath:secrets.properties

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=INFO
logging.level.com.example.backend=INFO
